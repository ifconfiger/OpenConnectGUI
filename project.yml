name: OpenConnectGUI
schemes:
  OpenConnectGUI:
    build:
      targets:
        OpenConnectGUI: all
  OpenConnectPrivilegedHelper:
    build:
      targets:
        OpenConnectPrivilegedHelper: all
  OpenConnectiOS:
    build:
      targets:
        OpenConnectiOS: all
  OpenConnectPacketTunnel:
    build:
      targets:
        OpenConnectPacketTunnel: all
options:
  bundleIdPrefix: xyz.nows
  developmentLanguage: en
  deploymentTarget:
    macOS: "13.0"
    iOS: "16.0"
targets:
  OpenConnectGUI:
    type: application
    platform: macOS
    sources:
      - path: Sources
      - path: Resources/Assets.xcassets
      - path: Resources/Localizable.xcstrings
      - path: Helper/vpnc-wrapper.sh
        buildPhase: resources
      - path: Vendor/OpenConnect/vpnc-script
        buildPhase: resources
      - path: Vendor/OpenConnect/macos/openconnect
        buildPhase:
          copyFiles:
            destination: executables
        attributes: [CodeSignOnCopy]
    dependencies:
      - target: OpenConnectPrivilegedHelper
        embed: false
    postBuildScripts:
      - name: Embed privileged helper
        script: |
          set -eu
          mkdir -p "$TARGET_BUILD_DIR/$CONTENTS_FOLDER_PATH/Library/LaunchDaemons"
          cp "$BUILT_PRODUCTS_DIR/OpenConnectPrivilegedHelper" "$TARGET_BUILD_DIR/$EXECUTABLE_FOLDER_PATH/OpenConnectPrivilegedHelper"
          cp "$SRCROOT/Helper/xyz.nows.openconnect.privileged.plist" "$TARGET_BUILD_DIR/$CONTENTS_FOLDER_PATH/Library/LaunchDaemons/"
          chmod 755 "$TARGET_BUILD_DIR/$EXECUTABLE_FOLDER_PATH/OpenConnectPrivilegedHelper" "$TARGET_BUILD_DIR/$EXECUTABLE_FOLDER_PATH/openconnect" "$TARGET_BUILD_DIR/$UNLOCALIZED_RESOURCES_FOLDER_PATH/vpnc-wrapper.sh" "$TARGET_BUILD_DIR/$UNLOCALIZED_RESOURCES_FOLDER_PATH/vpnc-script"
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: xyz.nows.openconnect
        PRODUCT_NAME: OpenConnectGUI
        MARKETING_VERSION: 0.1.0
        CURRENT_PROJECT_VERSION: 1
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        SWIFT_VERSION: 5.0
        ARCHS: arm64
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: OpenConnect GUI
        INFOPLIST_KEY_LSApplicationCategoryType: public.app-category.utilities
        CODE_SIGNING_ALLOWED: YES
        CODE_SIGN_STYLE: Manual
        CODE_SIGN_IDENTITY: "Developer ID Application: Fazheng Li (SWKH4B9DH8)"
        DEVELOPMENT_TEAM: SWKH4B9DH8
        CODE_SIGN_INJECT_BASE_ENTITLEMENTS: NO
        ENABLE_HARDENED_RUNTIME: YES
  OpenConnectPrivilegedHelper:
    type: tool
    platform: macOS
    sources:
      - path: Helper/main.swift
      - path: Sources/HelperProtocol.swift
      - path: Sources/Profile.swift
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: xyz.nows.openconnect.privileged
        PRODUCT_NAME: OpenConnectPrivilegedHelper
        SWIFT_VERSION: 5.0
        ARCHS: arm64
        CODE_SIGNING_ALLOWED: YES
        CODE_SIGN_STYLE: Manual
        CODE_SIGN_IDENTITY: "Developer ID Application: Fazheng Li (SWKH4B9DH8)"
        DEVELOPMENT_TEAM: SWKH4B9DH8
        CODE_SIGN_INJECT_BASE_ENTITLEMENTS: NO
        ENABLE_HARDENED_RUNTIME: YES
  OpenConnectiOS:
    type: application
    platform: iOS
    sources:
      - path: iOS/App
      - path: Sources/Profile.swift
      - path: Sources/KeychainStore.swift
      - path: iOS/Assets.xcassets
      - path: Resources/Localizable.xcstrings
    dependencies:
      - target: OpenConnectPacketTunnel
        embed: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: xyz.nows.openconnect
        PRODUCT_NAME: OpenConnect
        MARKETING_VERSION: 1.0
        CURRENT_PROJECT_VERSION: 1
        SWIFT_VERSION: 5.0
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: OpenConnect
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPhone: UIInterfaceOrientationPortrait UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPad: UIInterfaceOrientationPortrait UIInterfaceOrientationPortraitUpsideDown UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        CODE_SIGN_ENTITLEMENTS: iOS/App.entitlements
        CODE_SIGN_STYLE: Automatic
        DEVELOPMENT_TEAM: SWKH4B9DH8
        ARCHS: arm64
  OpenConnectPacketTunnel:
    type: app-extension
    platform: iOS
    info:
      path: iOS/Tunnel/Info.plist
      properties:
        NSExtension:
          NSExtensionPointIdentifier: com.apple.networkextension.packet-tunnel
          NSExtensionPrincipalClass: $(PRODUCT_MODULE_NAME).PacketTunnelProvider
    sources:
      - path: iOS/Tunnel
        excludes: [Info.plist]
      - path: Sources/Profile.swift
      - path: Sources/KeychainStore.swift
      - path: Resources/Localizable.xcstrings
    dependencies:
      - framework: Vendor/OpenConnect/OpenConnect.xcframework
        embed: false
      - sdk: libxml2.tbd
      - sdk: libz.tbd
      - sdk: libiconv.tbd
      - sdk: Security.framework
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: xyz.nows.openconnect.tunnel
        PRODUCT_NAME: OpenConnectPacketTunnel
        MARKETING_VERSION: 1.0
        CURRENT_PROJECT_VERSION: 1
        SWIFT_VERSION: 5.0
        CODE_SIGN_ENTITLEMENTS: iOS/Tunnel.entitlements
        CODE_SIGN_STYLE: Automatic
        DEVELOPMENT_TEAM: SWKH4B9DH8
        ARCHS: arm64
        SWIFT_OBJC_BRIDGING_HEADER: iOS/Tunnel/Tunnel-Bridging-Header.h
        HEADER_SEARCH_PATHS: $(SRCROOT)/Vendor/OpenConnect/OpenConnect.xcframework/ios-arm64/Headers
