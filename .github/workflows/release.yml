name: Release

on:
  push:
    tags:
      - "main-v*.*.*"

permissions:
  contents: write

jobs:
  build:
    # macos-latest 为 Apple Silicon (arm64) runner；项目只构建 arm64
    runs-on: macos-latest
    env:
      APPLE_SIGN_P12: ${{ secrets.APPLE_SIGN_P12 }}
      APPLE_SIGN_PASSWORD: ${{ secrets.APPLE_SIGN_PASSWORD }}
      APPLE_NOTARY_KEY: ${{ secrets.APPLE_NOTARY_KEY }}
      APPLE_NOTARY_KEY_ID: ${{ secrets.APPLE_NOTARY_KEY_ID }}
      APPLE_NOTARY_ISSUER: ${{ secrets.APPLE_NOTARY_ISSUER }}
      APP: build-signed/Build/Products/Release/OpenConnectGUI.app
    steps:
      - uses: actions/checkout@v4

      - name: Parse version
        run: |
          VERSION="${GITHUB_REF_NAME#main-v}"
          if [[ ! "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "tag 格式应为 main-vX.Y.Z，实际：$GITHUB_REF_NAME" >&2
            exit 1
          fi
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"

      # 特权辅助服务要求 App 与辅助服务用同一团队的有效签名，ad-hoc 版本无法使用，因此 secrets 缺一不可
      - name: Check secrets
        run: |
          for name in APPLE_SIGN_P12 APPLE_SIGN_PASSWORD APPLE_NOTARY_KEY APPLE_NOTARY_KEY_ID APPLE_NOTARY_ISSUER; do
            if [[ -z "${!name}" ]]; then
              echo "缺少 secret：$name" >&2
              exit 1
            fi
          done

      - name: Import signing certificate
        run: |
          KEYCHAIN="$RUNNER_TEMP/signing.keychain-db"
          KEYCHAIN_PASSWORD="$(openssl rand -hex 16)"
          P12="$RUNNER_TEMP/cert.p12"
          echo "$APPLE_SIGN_P12" | base64 --decode > "$P12"

          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security set-keychain-settings -lut 21600 "$KEYCHAIN"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security import "$P12" -k "$KEYCHAIN" -P "$APPLE_SIGN_PASSWORD" \
            -f pkcs12 -T /usr/bin/codesign -T /usr/bin/security
          security set-key-partition-list -S apple-tool:,apple: -s -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN" >/dev/null
          security list-keychains -d user -s "$KEYCHAIN" $(security list-keychains -d user | tr -d '"')
          rm -f "$P12"

          # project.yml 写死了签名身份，确认 p12 里的证书与之一致
          IDENTITY="$(grep -m1 'CODE_SIGN_IDENTITY: "Developer ID' project.yml | sed -E 's/.*"(.*)"/\1/')"
          if ! security find-identity -v -p codesigning "$KEYCHAIN" | grep -qF "\"$IDENTITY\""; then
            echo "p12 中没有 $IDENTITY" >&2
            security find-identity -v -p codesigning "$KEYCHAIN" >&2
            exit 1
          fi
          echo "KEYCHAIN=$KEYCHAIN" >> "$GITHUB_ENV"
          echo "IDENTITY=$IDENTITY" >> "$GITHUB_ENV"

      - name: Generate Xcode project
        run: |
          brew install xcodegen
          xcodegen generate

      - name: Build
        run: |
          xcodebuild -version
          xcodebuild -project OpenConnectGUI.xcodeproj -scheme OpenConnectGUI \
            -configuration Release -destination 'generic/platform=macOS' \
            -derivedDataPath build-signed \
            MARKETING_VERSION="$VERSION" \
            CURRENT_PROJECT_VERSION="${{ github.run_number }}" \
            OTHER_CODE_SIGN_FLAGS="--timestamp --keychain $KEYCHAIN" \
            build
          for bin in OpenConnectGUI OpenConnectPrivilegedHelper openconnect; do
            echo "== $bin: $(lipo -archs "$APP/Contents/MacOS/$bin")"
            codesign -dvv "$APP/Contents/MacOS/$bin" 2>&1 | grep -E 'Authority=Developer|flags|Timestamp'
          done
          codesign --verify --deep --strict --verbose=2 "$APP"

      - name: Create DMG
        run: |
          DMG="OpenConnectGUI-${VERSION}.dmg"
          STAGE="$RUNNER_TEMP/dmg"
          mkdir -p "$STAGE"
          ditto "$APP" "$STAGE/OpenConnectGUI.app"
          ln -s /Applications "$STAGE/Applications"
          # runner 上 hdiutil 偶发 "Resource busy"，重试几次
          for i in 1 2 3 4 5; do
            hdiutil create -volname "OpenConnect GUI" -srcfolder "$STAGE" \
              -fs HFS+ -format UDZO -ov "$DMG" && break
            [[ $i == 5 ]] && exit 1
            sleep 5
          done
          codesign --force --timestamp --keychain "$KEYCHAIN" --sign "$IDENTITY" "$DMG"
          codesign --verify --verbose=2 "$DMG"
          echo "DMG=$DMG" >> "$GITHUB_ENV"

      # 公证 dmg 会同时覆盖其中的 App；票据钉在 dmg 上，离线打开也能通过 Gatekeeper
      - name: Notarize
        run: |
          KEY="$RUNNER_TEMP/AuthKey.p8"
          # 兼容直接粘贴 .p8 内容或其 base64
          if [[ "$APPLE_NOTARY_KEY" == *"BEGIN PRIVATE KEY"* ]]; then
            printf '%s\n' "$APPLE_NOTARY_KEY" > "$KEY"
          else
            echo "$APPLE_NOTARY_KEY" | base64 --decode > "$KEY"
          fi
          AUTH=(--key "$KEY" --key-id "$APPLE_NOTARY_KEY_ID" --issuer "$APPLE_NOTARY_ISSUER")

          RESULT="$(xcrun notarytool submit "$DMG" "${AUTH[@]}" \
            --wait --timeout 30m --output-format json)"
          echo "$RESULT"
          ID="$(echo "$RESULT" | jq -r .id)"
          STATUS="$(echo "$RESULT" | jq -r .status)"
          # 无论成败都打印日志，便于排查（Accepted 时也可能有警告）
          xcrun notarytool log "$ID" "${AUTH[@]}" || true
          rm -f "$KEY"
          if [[ "$STATUS" != "Accepted" ]]; then
            echo "公证失败：$STATUS" >&2
            exit 1
          fi

          xcrun stapler staple "$DMG"
          xcrun stapler validate "$DMG"
          spctl --assess --type open --context context:primary-signature -vv "$DMG"
          shasum -a 256 "$DMG" > "$DMG.sha256"

      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" "$DMG" "$DMG.sha256" \
            --title "OpenConnect GUI ${VERSION}" \
            --generate-notes \
            --notes "仅支持 Apple Silicon (arm64)，macOS 13+。已使用 Developer ID 签名并通过 Apple 公证。打开 dmg 后将 OpenConnectGUI 拖入“应用程序”文件夹再运行，首次运行需在“系统设置 → 通用 → 登录项与扩展”批准后台服务。"

      - name: Clean up keychain
        if: always() && env.KEYCHAIN != ''
        run: security delete-keychain "$KEYCHAIN" || true
